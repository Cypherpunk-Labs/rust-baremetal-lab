[target.aarch64-unknown-none]
linker = "aarch64-none-elf-gcc"
rustflags = [
    # Use the external gcc linker (not rustc's bundled lld) so the Arm GNU
    # Toolchain sysroot (Newlib + libstdc++) is found and libs are ordered
    # correctly.
    "-C", "link-arg=-Tlinker.ld",
    "-C", "link-arg=-nostartfiles",
    "-C", "link-arg=-fuse-ld=bfd",
    "-C", "link-arg=-L/Users/mkemp/tools/arm-gnu-toolchain-15.2.rel1-darwin-arm64-aarch64-none-elf/aarch64-none-elf/lib",
    "-C", "link-arg=-Wl,--gc-sections",
    # C++ STL (libstdc++) + Newlib (libc) + math + gcc runtime.
    "-C", "link-arg=-lstdc++",
    "-C", "link-arg=-lm",
    "-C", "link-arg=-lc",
    "-C", "link-arg=-lgcc",
]
